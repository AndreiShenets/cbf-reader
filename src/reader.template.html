<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Comic Reader</title>
  <style>
    :root { color-scheme: dark; --bg: #111318; --panel: #1b1e26; --text: #e8eaf1; --muted: #a6adbf; --line: #363c4c; --accent: #b8a4ff; --reader-width: 820px; --header-height: 120px; }
    :root.light { color-scheme: light; --bg: #e4e5e8; --panel: #fff; --text: #202331; --muted: #586174; --line: #c6cad4; --accent: #6242bf; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; overflow-anchor: none; }
    header { position: fixed; inset: 0 0 auto; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; transition: transform .18s ease; }
    body.header-hidden header { transform: translateY(-100%); }
    #show-header { position: fixed; inset: 0 0 auto; height: 16px; width: 100%; z-index: 6; padding: 0; border: 0; border-radius: 0; background: transparent; opacity: 0; pointer-events: none; }
    body.header-hidden #show-header { pointer-events: auto; }
    #show-header:focus-visible { opacity: 1; background: var(--panel); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; max-width: 1500px; margin: auto; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    h1 { margin: 0; font-size: 16px; letter-spacing: .02em; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .navigation, .settings { display: flex; align-items: center; gap: 8px; }
    button, select { min-height: 36px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); font: inherit; padding: 6px 10px; cursor: pointer; }
    button:hover:not(:disabled), select:hover { border-color: var(--accent); }
    button:disabled { opacity: .35; cursor: default; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    select { max-width: 245px; }
    .settings label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    input[type=range] { width: 90px; accent-color: var(--accent); }
    input[type=checkbox] { accent-color: var(--accent); }
    output { min-width: 49px; }
    .status { display: flex; justify-content: space-between; gap: 12px; max-width: 1500px; margin: 7px auto 0; color: var(--muted); font-size: 12px; }
    progress { display: block; width: 100%; height: 3px; margin-top: 7px; accent-color: var(--accent); }
    main { width: min(100%, var(--reader-width)); margin: var(--header-height) auto 0; }
    .chapter-title { margin: 0; text-align: center; padding: 22px 10px; font-size: 17px; font-weight: 500; }
    #pages img { display: block; width: 100%; height: auto; margin: 0; background: #fff; }
    #pages .failed { outline: 2px solid #d77b7b; outline-offset: -2px; }
    footer { text-align: center; padding: 30px 10px 50px; }
    footer button { padding: 12px 24px; }
    #empty-state { text-align: center; padding: 100px 20px; }
    #empty-state h2 { font-size: 24px; font-weight: 500; margin: 0 0 24px; }
    #open-start { padding: 12px 28px; }
    #notice { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: min(90vw, 650px); border: 1px solid var(--line); background: var(--panel); padding: 12px 16px; border-radius: 8px; z-index: 7; }
    #notice button { float: right; margin-left: 10px; min-height: 26px; padding: 0 6px; }
    [hidden] { display: none !important; }
    noscript p { padding: 30px; text-align: center; }
    @media (prefers-reduced-motion: reduce) { header { transition: none; } }
    @media (max-width: 760px) {
      header { padding: 8px; }
      .toolbar { gap: 8px; }
      .brand { flex: 1; }
      h1 { max-width: 150px; font-size: 14px; }
      .settings { flex-wrap: wrap; gap: 6px; }
      .settings .width-title { display: none; }
      input[type=range] { width: 60px; }
      .navigation { width: 100%; justify-content: center; order: 3; }
      select { flex: 1; max-width: none; }
      .status { font-size: 11px; }
      #saving { display: none; }
    }
  </style>
</head>
<body>
  <button id="show-header" type="button" aria-label="Show toolbar"></button>
  <header id="toolbar">
    <div class="toolbar">
      <div class="brand">
        <h1 id="book-title">Comic Reader</h1>
        <button id="open-cbz" type="button" title="Open a local CBZ or ZIP file">Open CBZ</button>
        <button id="close-book" type="button" hidden>Close book</button>
        <input id="cbz-file" type="file" accept=".cbz,.zip,application/zip,application/vnd.comicbook+zip" hidden>
      </div>
      <nav class="navigation" aria-label="Chapter navigation">
        <button id="previous" type="button" title="Previous chapter (←)" aria-label="Previous chapter" disabled>←</button>
        <select id="chapter" aria-label="Chapter" disabled><option>No book open</option></select>
        <button id="next" type="button" title="Next chapter (→)" aria-label="Next chapter" disabled>→</button>
      </nav>
      <div class="settings">
        <label title="Automatically append the next chapter"><input id="infinite" type="checkbox">Continuous</label>
        <label><span class="width-title">Width</span><input id="width" type="range" min="480" max="1400" step="20" aria-label="Page width"><output id="width-label"></output></label>
        <button id="theme" type="button">Light theme</button>
      </div>
    </div>
    <div class="status"><span id="position" role="status">No book open</span><span id="saving"></span></div>
    <progress id="progress" max="100" value="0" aria-label="Chapter progress"></progress>
  </header>
  <noscript><p>Enable JavaScript to use the reader. No internet connection is needed.</p></noscript>
  <main>
    <section id="empty-state"><h2>Open a comic</h2><button id="open-start" type="button">Open CBZ</button></section>
    <div id="pages"></div>
    <footer hidden><button id="continue" type="button">Next chapter →</button></footer>
  </main>
  <div id="notice" role="alert" hidden><button id="close-notice" aria-label="Dismiss" type="button">×</button><span id="notice-text"></span></div>
  <!-- zip.js 2.24.0, BSD-3-Clause. License included below. -->
  <script>__ZIP_JS__</script>
  <script>__READER_JS__</script>
  <!-- __ZIP_LICENSE__ -->
</body>
</html>
